<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forma mudou de endereço</title>
  <style>body{font-family:system-ui,sans-serif;background:#E9EEEC;color:#1C2A27;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:inherit;font-weight:700}</style>
</head>
<body>
  <p>O Forma agora é um app separado.<br><a id="ir" href="/forma/">Abrir o Forma</a></p>
  <script>
    // Remove o app antigo que ficava dentro do Fôlego e leva para o endereço novo.
    (async () => {
      try {
        const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(regs.filter((r) => r.scope.includes('/folego/forma/')).map((r) => r.unregister()));
        const ks = await caches.keys();
        await Promise.all(ks.filter((k) => k.startsWith('forma-')).map((k) => caches.delete(k)));
      } catch (e) {}
      location.replace('/forma/' + location.hash);
    })();
  </script>
</body>
</html>
