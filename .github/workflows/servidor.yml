# Publica banco (migrations), segredos e funções no Supabase a cada alteração em supabase/.
# Secrets necessários (Settings → Secrets and variables → Actions → Secrets): os mesmos nomes do .env.example.
name: Publicar servidor
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Banco de dados
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Segredos do servidor
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_CONNECTOR_IDS: ${{ secrets.PLUGGY_CONNECTOR_IDS }}
          PLUGGY_ALLOWED_EMAILS: ${{ secrets.PLUGGY_ALLOWED_EMAILS }}
          PLUGGY_WEBHOOK_SECRET: ${{ secrets.PLUGGY_WEBHOOK_SECRET }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_NOTIFY_TEMPLATE: ${{ secrets.WA_NOTIFY_TEMPLATE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_LIMIT: ${{ secrets.AI_DAILY_LIMIT }}
          APP_ORIGINS: ${{ secrets.APP_ORIGINS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORMA_IA_LIMITE_DIA: ${{ secrets.FORMA_IA_LIMITE_DIA }}
        run: |
          f=$(mktemp)
          for k in PLUGGY_CLIENT_ID PLUGGY_CLIENT_SECRET PLUGGY_CONNECTOR_IDS PLUGGY_ALLOWED_EMAILS PLUGGY_WEBHOOK_SECRET \
                   WA_PHONE_NUMBER_ID WA_ACCESS_TOKEN WA_APP_SECRET WA_VERIFY_TOKEN WA_NOTIFY_TEMPLATE \
                   ANTHROPIC_API_KEY AI_DAILY_LIMIT APP_ORIGINS CRON_SECRET \
                   VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT FORMA_IA_LIMITE_DIA; do
            if [ -n "${!k}" ]; then echo "$k=${!k}" >> "$f"; fi
          done
          if [ -s "$f" ]; then supabase secrets set --env-file "$f" --project-ref "$REF"; else echo "Nenhum segredo extra definido ainda"; fi
          rm -f "$f"
      - name: Funções
        run: |
          for fn in pluggy import-statement pluggy-webhook whatsapp-webhook telegram-webhook ingest-notification weekly-digest forma-ia forma-lembretes; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$REF"
          done
      - name: Resumo semanal (segunda 8h45 de Brasília)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET não definido — pulando agendamento"; exit 0; fi
          supabase db query --linked "
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          select cron.schedule('resumo-semanal', '45 11 * * 1', \$\$
            select net.http_post(
              url := 'https://${REF}.supabase.co/functions/v1/weekly-digest',
              headers := jsonb_build_object('Authorization', 'Bearer ${CRON_SECRET}'));
          \$\$);"
      - name: Forma — lembretes de água, pesagem e treino (a cada 15 min)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET não definido — pulando agendamento"; exit 0; fi
          supabase db query --linked "
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          select cron.schedule('forma-lembretes', '*/15 * * * *', \$\$
            select net.http_post(
              url := 'https://${REF}.supabase.co/functions/v1/forma-lembretes?acao=tick',
              headers := jsonb_build_object('Authorization', 'Bearer ${CRON_SECRET}'));
          \$\$);"
      - name: Ligar o robô do Telegram ao servidor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN não definido — pulando"; exit 0; fi
          SECRET=$(printf '%s' "$TELEGRAM_BOT_TOKEN:folego-webhook" | sha256sum | cut -d' ' -f1)
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS "$API/setWebhook" -H "Content-Type: application/json" -d "{\"url\":\"https://${REF}.supabase.co/functions/v1/telegram-webhook\",\"secret_token\":\"$SECRET\",\"allowed_updates\":[\"message\",\"edited_message\"],\"drop_pending_updates\":false}" | grep -q '"ok":true' && echo "Webhook do Telegram configurado"
          curl -fsS "$API/setMyCommands" -H "Content-Type: application/json" -d '{"commands":[
            {"command":"resumo","description":"Quanto posso gastar até o salário"},
            {"command":"hoje","description":"Gastos de hoje"},
            {"command":"semana","description":"Gastos da semana"},
            {"command":"mes","description":"Gastos do mês"},
            {"command":"orcamento","description":"Situação de cada categoria"},
            {"command":"contas","description":"Contas fixas, faturas e parcelas"},
            {"command":"ultimos","description":"Últimos lançamentos"},
            {"command":"reembolso","description":"Gastos da empresa a receber"},
            {"command":"desfazer","description":"Apaga o último lançamento feito aqui"},
            {"command":"ajuda","description":"Todos os comandos"}]}' > /dev/null && echo "Menu de comandos configurado"
