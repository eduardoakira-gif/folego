# Publica banco (migrations), segredos e funções no Supabase a cada alteração em supabase/.
# Secrets necessários (Settings → Secrets and variables → Actions → Secrets): os mesmos nomes do .env.example.
name: Publicar servidor
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Banco de dados
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Segredos do servidor
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_CONNECTOR_IDS: ${{ secrets.PLUGGY_CONNECTOR_IDS }}
          PLUGGY_ALLOWED_EMAILS: ${{ secrets.PLUGGY_ALLOWED_EMAILS }}
          PLUGGY_WEBHOOK_SECRET: ${{ secrets.PLUGGY_WEBHOOK_SECRET }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_NOTIFY_TEMPLATE: ${{ secrets.WA_NOTIFY_TEMPLATE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_LIMIT: ${{ secrets.AI_DAILY_LIMIT }}
          APP_ORIGINS: ${{ secrets.APP_ORIGINS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          f=$(mktemp)
          for k in PLUGGY_CLIENT_ID PLUGGY_CLIENT_SECRET PLUGGY_CONNECTOR_IDS PLUGGY_ALLOWED_EMAILS PLUGGY_WEBHOOK_SECRET \
                   WA_PHONE_NUMBER_ID WA_ACCESS_TOKEN WA_APP_SECRET WA_VERIFY_TOKEN WA_NOTIFY_TEMPLATE \
                   ANTHROPIC_API_KEY AI_DAILY_LIMIT APP_ORIGINS CRON_SECRET; do
            [ -n "${!k}" ] && echo "$k=${!k}" >> "$f"
          done
          [ -s "$f" ] && supabase secrets set --env-file "$f" --project-ref "$REF"
          rm -f "$f"
      - name: Funções
        run: |
                    for fn in pluggy import-statement pluggy-webhook whatsapp-webhook ingest-notification weekly-digest; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$REF"
          done
      - name: Resumo semanal (segunda 8h45 de Brasília)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -z "$CRON_SECRET" ] && { echo "CRON_SECRET não definido — pulando agendamento"; exit 0; }
          supabase db query --linked "
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          select cron.schedule('resumo-semanal', '45 11 * * 1', \$\$
            select net.http_post(
              url := 'https://${REF}.supabase.co/functions/v1/weekly-digest',
              headers := jsonb_build_object('Authorization', 'Bearer ${CRON_SECRET}'));
          \$\$);"
